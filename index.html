<html lang="ru">
<head>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --accent: #22c55e;
      --accent2: #38bdf8;
      --danger: #f97316;
      --border: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px;
      background: rgba(15,23,42,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(22px, 4vw, 34px);
    }
    .sub {
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.45;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(56,189,248,.18);
    }
    button {
      border: 1px solid var(--border);
      background: #1f2937;
      color: var(--text);
      padding: 13px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    button:hover { background: #334155; }
    main {
      padding: 18px 16px 50px;
    }
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .pill {
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
    }
    .grid {
      display: grid;
      gap: 12px;
    }
    .card {
      background: rgba(17,24,39,.94);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .qtop {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .num {
      color: var(--accent2);
      font-weight: bold;
      min-width: 56px;
    }
    .question {
      font-size: 17px;
      line-height: 1.45;
      font-weight: 700;
      flex: 1;
    }
    .answers {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .answer {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      line-height: 1.35;
    }
    .correct {
      border-color: rgba(34,197,94,.55);
      background: rgba(34,197,94,.13);
    }
    mark {
      background: rgba(250,204,21,.35);
      color: inherit;
      border-radius: 4px;
      padding: 0 2px;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 10px;
      border: 1px dashed var(--border);
      border-radius: 18px;
    }
    .small {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }
    @media (max-width: 700px) {
      .controls { grid-template-columns: 1fr; }
      button { width: 100%; }
      .qtop { flex-direction: column; }
      .num { min-width: 0; }
    }
  </style>
</head>

    const search = document.getElementById('search');
    const list = document.getElementById('list');

    let onlyCorrect = false;

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[s]));
    }

    function highlight(text, query) {
      const safe = escapeHTML(text);
      const q = query.trim();
      if (!q) return safe;
      const words = q.split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      if (!words.length) return safe;
      const re = new RegExp('(' + words.join('|') + ')', 'gi');
      return safe.replace(re, '<mark>$1</mark>');
    }

    function normalize(s) {
      return String(s).toLowerCase().replace(/ё/g, 'е');
    }

    function render() {
      const q = search.value.trim();
      const nq = normalize(q);
      const filtered = DATA.filter(item => {

      shown.textContent = 'Показано: ' + filtered.length;

      list.innerHTML = filtered.map((item, idx) => {
        const originalNumber = DATA.indexOf(item) + 1;
        const answers = item.answers.map((a, i) => {
          const isCorrect = item.correct_indexes.includes(i);
          if (onlyCorrect && !isCorrect) return '';
          return `<div class="answer ${isCorrect ? 'correct' : ''}">${isCorrect ? '✅ ' : ''}${highlight(a, q)}</div>`;
        }).join('');

        return `<section class="card">
          <div class="qtop">
            <div class="num">#${originalNumber}</div>
            <div class="question">${highlight(item.question, q)}</div>
          </div>
          <div class="answers">${answers}</div>
        </section>`;
      }).join('');
    }

    search.addEventListener('input', render);
    showAllBtn.addEventListener('click', () => {
      search.value = '';
      onlyCorrect = false;
      onlyCorrectBtn.textContent = 'Только правильные ответы';
      render();
      search.focus();
    });
    onlyCorrectBtn.addEventListener('click', () => {
      onlyCorrect = !onlyCorrect;
      onlyCorrectBtn.textContent = onlyCorrect ? 'Показать все варианты' : 'Только правильные ответы';
      render();
    });

    render();
  </script>
</body>
</html>
